<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lex Vitals Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap');
  :root {
    --bg: rgba(11, 11, 11, 0.88);
    --line: #2b2b2b;
    --accent: #9d92ff;
    --text: #f4f1ea;
    --muted: #e2ded6;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body.preview { background: linear-gradient(160deg, #6b7a8f, #2b3240); }
  #grid {
    position: absolute; left: 48px; top: 560px; width: 340px;
    display: grid; grid-template-columns: 1fr;
    text-shadow: 0 2px 14px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.6);
    font-family: Inter, system-ui, sans-serif; color: var(--text);
  }
  .tile { padding: 0 0 44px; }
  .label { display: flex; align-items: center; gap: 12px; color: var(--accent); font-weight: 600; font-size: 20px; letter-spacing: 0.2em; }
  .label svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6)); }
  .num { margin-top: 18px; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 78px; line-height: 1; }
  .unit { font-family: Inter, sans-serif; font-size: 26px; color: var(--muted); margin-left: 10px; }
  #heart { transform-origin: center; }
  /* green-screen export: hard outline instead of soft shadow, so chroma key leaves no green fringe */
  body.keyable #grid { text-shadow: 2px 0 #111, -2px 0 #111, 0 2px #111, 0 -2px #111, 2px 2px #111, -2px -2px #111, 2px -2px #111, -2px 2px #111; }
  body.keyable .label svg { filter: drop-shadow(1.5px 0 0 #111) drop-shadow(-1.5px 0 0 #111) drop-shadow(0 1.5px 0 #111) drop-shadow(0 -1.5px 0 #111); }
</style>
</head>
<body>
<div id="grid">
  <div class="tile">
    <div class="label">
      <svg id="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      HEART RATE
    </div>
    <div class="num"><span id="hr">--</span><span class="unit">bpm</span></div>
  </div>
  <div class="tile">
    <div class="label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/></svg>
      BREATHING
    </div>
    <div class="num"><span id="br">--</span><span class="unit">br/min</span></div>
  </div>
  <div class="tile">
    <div class="label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
      STRESS
    </div>
    <div class="num"><span id="st">--</span></div>
  </div>
</div>

<script>
// ---- EDIT THESE with Lex's real PetPace readings ----
// `at` = second in the video where the stage starts. stress: 0-34 Low, 35-64 Medium, 65+ High.
const STAGES = [
  { at: 4,  name: 'Check-in',          hr: 85,  br: 18, stress: 15 },
  { at: 5,  name: 'Security',          hr: 105, br: 22, stress: 45 },
  { at: 6,  name: 'Playtime/boarding', hr: 95,  br: 20, stress: 25 },
  { at: 8,  name: 'Into the carrier',  hr: 115, br: 24, stress: 50 },
  { at: 9,  name: 'Take-off',          hr: 150, br: 34, stress: 85 },
  { at: 11, name: 'Lap/restroom',      hr: 100, br: 21, stress: 25 },
  { at: 14, name: 'Landing/off plane', hr: 82,  br: 17, stress: 10 },
];
const END = 18;          // second the overlay disappears
const FPS = 30;
const READOUT_EVERY = 0.5; // seconds between number updates, like a real monitor
const WOBBLE_HR = 4;     // +/- bpm natural variation within a stage
const WOBBLE_BR = 1.5;   // +/- br/min natural variation within a stage
// -----------------------------------------------------

const TOTAL = END;
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

// smooth deterministic noise in [-1, 1]
function noise(t, seed) {
  return (Math.sin(t * 1.3 + seed) * 0.5 + Math.sin(t * 2.9 + seed * 2.1) * 0.3 + Math.sin(t * 5.7 + seed * 3.7) * 0.2);
}

function valuesAt(t) {
  let i = 0;
  while (i < STAGES.length - 1 && t >= STAGES[i + 1].at) i++;
  const cur = STAGES[i], prev = STAGES[Math.max(0, i - 1)];
  const k = i === 0 ? 1 : ease((t - cur.at) / 0.6);
  const mix = (key) => prev[key] + (cur[key] - prev[key]) * k;
  return {
    hr: mix('hr') + noise(t, 1) * WOBBLE_HR,
    br: mix('br') + noise(t * 0.7, 5) * WOBBLE_BR,
    stress: mix('stress'),
  };
}

const band = (v, lo, hi, words) => words[v < lo ? 0 : v < hi ? 1 : 2];

// heart icon beats at the current heart rate
function beatPhase(t) {
  let p = 0;
  for (let s = 0; s < t; s += 1 / FPS) p += (valuesAt(s).hr / 60) / FPS;
  return p % 1;
}

function render(t) {
  const first = STAGES[0].at;
  const fade = Math.min(ease((t - first) / 0.3), ease((END - t) / 0.3));
  document.getElementById('grid').style.opacity = t < first || t >= END ? 0 : fade;
  const shown = valuesAt(Math.max(first, Math.floor(t / READOUT_EVERY) * READOUT_EVERY));
  document.getElementById('hr').textContent = Math.round(shown.hr);
  document.getElementById('br').textContent = Math.round(shown.br);
  document.getElementById('st').textContent = band(valuesAt(t).stress, 35, 65, ['Low', 'Medium', 'High']);
  const b = beatPhase(t);
  document.getElementById('heart').style.transform = `scale(${1 + 0.18 * Math.exp(-b * 9)})`;
}

window.OVERLAY = { render, TOTAL, FPS };

if (!navigator.webdriver) {
  document.body.classList.add('preview');
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
