<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lex Vitals Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap');
  :root {
    --bg: rgba(11, 11, 11, 0.88);
    --line: #2b2b2b;
    --accent: #7b6cf6;
    --text: #f4f1ea;
    --muted: #a9a59c;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body.preview { background: linear-gradient(160deg, #6b7a8f, #2b3240); }
  #grid {
    position: absolute; left: 60px; top: 230px; width: 840px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--bg); border: 2px solid var(--line);
    font-family: Inter, system-ui, sans-serif; color: var(--text);
  }
  .tile { padding: 30px 28px 32px; border-left: 2px solid var(--line); }
  .tile:first-child { border-left: 0; }
  .label { display: flex; align-items: center; gap: 12px; color: var(--accent); font-weight: 600; font-size: 20px; letter-spacing: 0.2em; }
  .label svg { width: 30px; height: 30px; flex: none; }
  .num { margin-top: 26px; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 78px; line-height: 1; }
  .unit { font-family: Inter, sans-serif; font-size: 26px; color: var(--muted); margin-left: 10px; }
  .sub { margin-top: 18px; font-size: 24px; color: var(--muted); }
  #heart { transform-origin: center; }
</style>
</head>
<body>
<div id="grid">
  <div class="tile">
    <div class="label">
      <svg id="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      HEART RATE
    </div>
    <div class="num"><span id="hr">--</span><span class="unit">bpm</span></div>
    <div class="sub" id="hrSub">Resting range</div>
  </div>
  <div class="tile">
    <div class="label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/></svg>
      BREATHING
    </div>
    <div class="num"><span id="br">--</span><span class="unit">br/min</span></div>
    <div class="sub" id="brSub">Calm &amp; steady</div>
  </div>
  <div class="tile">
    <div class="label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
      STRESS
    </div>
    <div class="num"><span id="st">--</span></div>
    <div class="sub" id="stSub">Relaxed</div>
  </div>
</div>

<script>
// ---- EDIT THESE with Lex's real PetPace readings ----
// Each stage holds for `seconds`; values ease over the first second of the next stage.
const STAGES = [
  { name: 'CHECK-IN', seconds: 5, hr: 88,  br: 18, stress: 14 },
  { name: 'SECURITY', seconds: 5, hr: 112, br: 24, stress: 46 },
  { name: 'TAKE-OFF', seconds: 5, hr: 148, br: 34, stress: 86 },
  { name: 'LANDING',  seconds: 5, hr: 92,  br: 19, stress: 18 },
];
const FPS = 30;
// -----------------------------------------------------

const TOTAL = STAGES.reduce((s, x) => s + x.seconds, 0);
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

function valuesAt(t) {
  let start = 0, i = 0;
  while (i < STAGES.length - 1 && t >= start + STAGES[i].seconds) start += STAGES[i++].seconds;
  const cur = STAGES[i], prev = STAGES[Math.max(0, i - 1)];
  const k = i === 0 ? 1 : ease((t - start) / 1.0);
  const mix = (key) => prev[key] + (cur[key] - prev[key]) * k;
  const j = (f, a) => Math.sin(t * f) * a + Math.sin(t * f * 2.3 + 1) * a * 0.5;
  return { hr: mix('hr') + j(1.7, 1.5), br: mix('br') + j(0.9, 0.6), stress: mix('stress') };
}

const band = (v, lo, hi, words) => words[v < lo ? 0 : v < hi ? 1 : 2];

// heart icon beats at the current heart rate
function beatPhase(t) {
  let p = 0;
  for (let s = 0; s < t; s += 1 / FPS) p += (valuesAt(s).hr / 60) / FPS;
  return p % 1;
}

function render(t) {
  const v = valuesAt(t);
  document.getElementById('hr').textContent = Math.round(v.hr);
  document.getElementById('br').textContent = Math.round(v.br);
  document.getElementById('st').textContent = band(v.stress, 35, 65, ['Low', 'Medium', 'High']);
  document.getElementById('hrSub').textContent = band(v.hr, 100, 130, ['Resting range', 'Elevated', 'Racing']);
  document.getElementById('brSub').textContent = band(v.br, 22, 30, ['Calm & steady', 'Picking up', 'Fast']);
  document.getElementById('stSub').textContent = band(v.stress, 35, 65, ['Relaxed', 'Alert', 'Stressed']);
  const b = beatPhase(t);
  document.getElementById('heart').style.transform = `scale(${1 + 0.18 * Math.exp(-b * 9)})`;
}

window.OVERLAY = { render, TOTAL, FPS };

if (!navigator.webdriver) {
  document.body.classList.add('preview');
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
