# One-click deploy on Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: pawcut
    runtime: docker
    plan: starter # always on; needed for the album checks and the morning batch
    healthCheckPath: /healthz
    disk:
      name: pawcut-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false # Google sign-in, the only way in (see README); without it the app stays locked
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false # comma-separated Google accounts allowed in; nobody else can sign in
      - key: APIFY_TOKEN
        sync: false # optional: apify.com API token; caption research then searches TikTok with real view counts
      - key: ELEVENLABS_API_KEY
        sync: false # optional: elevenlabs.io API key; clones your voice to read story voiceovers
      - key: APP_URL
        value: https://studio.lexintheair.com
      - key: MEMORY_MB
        value: "512" # Starter plan; raise if you upgrade (2048 on Standard enables 4K uploads)
      - key: AI_MONTHLY_BUDGET
        value: "20" # default monthly AI cap in USD; can be changed in Settings
      - key: TZ
        sync: false # your time zone, e.g. Europe/London, so the morning batch runs at your 8:00
